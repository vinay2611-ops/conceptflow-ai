                  nodes = new vis.DataSet([{"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Vectors", "label": "Vectors", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eVectors\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            An ordered collection of numbers representing magnitude and direction or data features.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Scalar Multiplication", "label": "Scalar Multiplication", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eScalar Multiplication\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Multiplying a vector by a number to change its magnitude while preserving its direction.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Matrices", "label": "Matrices", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eMatrices\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            A rectangular arrangement of numbers organized into rows and columns.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Linear Transformations", "label": "Linear Transformations", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eLinear Transformations\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Functions that map vectors from one space to another while preserving vector operations.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Matrix Multiplication", "label": "Matrix Multiplication", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eMatrix Multiplication\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Combining rows and columns of matrices to compute new values or represent sequential operations.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Eigenvectors", "label": "Eigenvectors", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eEigenvectors\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Nonzero vectors whose direction remains unchanged when a matrix transformation is applied.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Eigenvalues", "label": "Eigenvalues", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eEigenvalues\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Scalars that describe the amount by which eigenvectors are scaled during a transformation.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}]);
