                  nodes = new vis.DataSet([{"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Cloud Computing", "label": "Cloud Computing", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eCloud Computing\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            On-demand access to computational resources, storage, and services over the internet with a pay-as-you-go pricing model.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Virtualization", "label": "Virtualization", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eVirtualization\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The process of creating virtual representations of physical hardware like servers and storage to run multiple virtual machines on a single machine.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Hypervisor", "label": "Hypervisor", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eHypervisor\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Special software that creates and manages virtual machines on a physical computer.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Cloud Architecture", "label": "Cloud Architecture", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eCloud Architecture\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The structural framework containing frontend and backend components required for designing and managing cloud solutions.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Service-Oriented Architecture (SOA)", "label": "Service-Oriented Architecture (SOA)", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eService-Oriented Architecture (SOA)\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            An architectural approach where software components are made reusable and interoperable through network-accessible services.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Multi-tenancy", "label": "Multi-tenancy", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eMulti-tenancy\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            An architecture where a single software instance serves multiple distinct customer groups while keeping their data completely separate and secure.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Resource Pooling", "label": "Resource Pooling", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eResource Pooling\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            A group of computing, network, and storage resources maintained in a data center to be dynamically assigned to users based on demand.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Cloud Deployment Models", "label": "Cloud Deployment Models", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eCloud Deployment Models\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Categories specifying how cloud services are hosted, including public, private, hybrid, and community clouds.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}, {"color": {"background": "#2563eb", "border": "#93c5fd", "highlight": {"background": "#3b82f6", "border": "#ffffff"}}, "font": {"color": "white"}, "id": "Cloud Computing Services", "label": "Cloud Computing Services", "shape": "dot", "size": 35, "title": "\n            \u003cb\u003eCloud Computing Services\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Service models including IaaS, PaaS, SaaS, and FaaS that deliver different levels of control and management over computing resources.\u003cbr\u003e\u003cbr\u003e\n            \u003cb\u003eType:\u003c/b\u003e Core Concept\n            "}]);
